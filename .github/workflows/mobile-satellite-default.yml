name: Apply satellite default and mobile filter collapse
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          # Transport panel header + mobile collapse button.
          old = '<div class="panel glass"><h2>Verkehrsmittel</h2><div id="filters" class="filters"></div></div>'
          new = '<div id="transportPanel" class="panel glass transport-panel"><div class="transport-head"><h2>Verkehrsmittel</h2><button id="filterToggle" class="filter-toggle" type="button" aria-expanded="true" title="Verkehrsmittel ein-/ausklappen">⌄</button></div><div id="filters" class="filters"></div></div>'
          if old not in s:
              raise SystemExit('transport panel marker not found')
          s = s.replace(old, new, 1)

          # CSS for compact mobile transport selector.
          anchor = '.panel h2{margin:0 0 10px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#dce7f5}'
          addon = anchor + '\n.transport-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.transport-head h2{margin:0 0 10px}.filter-toggle{display:none;width:32px;height:28px;padding:0;border:1px solid var(--border);background:rgba(255,255,255,.055);color:var(--text);border-radius:9px;font-size:18px;line-height:1;cursor:pointer;transition:transform .18s ease,background .18s ease}.filter-toggle:hover{background:rgba(255,255,255,.1)}'
          if anchor not in s:
              raise SystemExit('panel css marker not found')
          s = s.replace(anchor, addon, 1)

          old_mobile = '@media(max-width:700px){.top{left:9px;right:9px;top:9px}.brand{padding:8px 10px}.sub{display:none}.status small{display:none}.side{left:9px;right:9px;top:auto;bottom:10px;width:auto}.side .secondary{display:none}.filters{grid-template-columns:repeat(3,1fr)}.filter{padding:7px 5px;font-size:10px}.cnt{display:none}.controls{right:9px;bottom:190px}.map-style-menu{right:60px;bottom:190px;width:190px}.warn{bottom:190px}}'
          new_mobile = '@media(max-width:700px){.top{left:9px;right:9px;top:9px}.brand{padding:8px 10px}.sub{display:none}.status small{display:none}.side{left:9px;right:9px;top:auto;bottom:10px;width:auto}.side .secondary{display:none}.transport-panel{padding:9px 10px}.transport-head h2{margin:0}.filter-toggle{display:grid;place-items:center}.transport-panel.mobile-collapsed .filters{display:none}.transport-panel.mobile-collapsed{padding:7px 9px}.transport-panel.mobile-collapsed .filter-toggle{transform:rotate(-90deg)}.filters{grid-template-columns:repeat(3,1fr);margin-top:8px}.filter{padding:7px 5px;font-size:10px}.cnt{display:none}.controls{right:9px;bottom:126px}.map-style-menu{right:60px;bottom:126px;width:190px}.warn{bottom:126px}body:not(.filters-collapsed) .controls{bottom:190px}body:not(.filters-collapsed) .map-style-menu{bottom:190px}body:not(.filters-collapsed) .warn{bottom:190px}}'
          if old_mobile not in s:
              raise SystemExit('mobile css marker not found')
          s = s.replace(old_mobile, new_mobile, 1)

          # Satellite first in the style menu.
          sat = '    <button class="map-style-option" type="button" data-map-style="satellite" role="menuitem"><span class="map-style-icon">🛰️</span><span><span class="map-style-name">Satellit</span><span class="map-style-sub">Luft- und Satellitenbilder</span></span></button>\n'
          if sat not in s:
              raise SystemExit('satellite menu item not found')
          s = s.replace(sat, '', 1)
          menu_anchor = '  <div class="map-style-list">\n'
          s = s.replace(menu_anchor, menu_anchor + sat, 1)

          # Always start in satellite mode. User can switch afterwards.
          start = 'function savedMapStyle(){\n  try{\n    const key=localStorage.getItem("berlin-live-transit-map-style");\n    return MAP_STYLES[key]?key:"dark";\n  }catch{return "dark"}\n}'
          repl = 'function savedMapStyle(){\n  return "satellite";\n}'
          if start not in s:
              raise SystemExit('savedMapStyle marker not found')
          s = s.replace(start, repl, 1)

          # Mobile collapse logic. Starts collapsed on phones, remains expanded on desktop.
          bind_anchor = 'buildFilters();\nupdateFocusButton();\n'
          bind_code = '''buildFilters();
updateFocusButton();

function setFiltersCollapsed(collapsed){
  const panel=$("transportPanel");
  const btn=$("filterToggle");
  if(!panel||!btn)return;
  const on=Boolean(collapsed)&&window.innerWidth<=700;
  panel.classList.toggle("mobile-collapsed",on);
  document.body.classList.toggle("filters-collapsed",on);
  btn.setAttribute("aria-expanded",String(!on));
  btn.textContent=on?"›":"⌄";
  btn.title=on?"Verkehrsmittel anzeigen":"Verkehrsmittel minimieren";
  setTimeout(()=>map.invalidateSize(false),50);
}

$("filterToggle").addEventListener("click",()=>{
  setFiltersCollapsed(!$("transportPanel").classList.contains("mobile-collapsed"));
});
if(window.innerWidth<=700)setFiltersCollapsed(true);
window.addEventListener("resize",()=>{
  if(window.innerWidth>700)setFiltersCollapsed(false);
});
'''
          if bind_anchor not in s:
              raise SystemExit('binding marker not found')
          s = s.replace(bind_anchor, bind_code, 1)

          p.write_text(s, encoding='utf-8')

          # Self-clean this temporary workflow.
          Path('.github/workflows/mobile-satellite-default.yml').unlink(missing_ok=True)
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Satellite default and collapsible mobile filters"
          git push