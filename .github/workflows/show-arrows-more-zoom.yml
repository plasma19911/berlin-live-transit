name: Show arrows at normal zoom

'on':
  push:
    paths:
      - '.github/workflows/show-arrows-more-zoom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep vehicle icons down to zoom 10
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old='const mode=plannedFilterActive?"icons":(zoom<=11?"dots":"icons");'
          new='const mode=plannedFilterActive?"icons":(zoom<=9?"dots":"icons");'
          assert old in s, 'render mode threshold not found'
          s=s.replace(old,new,1)
          old='const bounds=map.getBounds().pad(plannedFilterActive?0.80:(zoom<=11?0.03:0.12));'
          new='const bounds=map.getBounds().pad(plannedFilterActive?0.80:(zoom<=9?0.03:0.12));'
          assert old in s, 'bounds threshold not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          js=max(blocks,key=len)
          Path('/tmp/index-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit
        run: |
          git config user.name "ChatGPT UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/show-arrows-more-zoom.yml
          git add public/index.html
          git diff --cached --check
          git commit -m "Show direction arrows at normal map zoom"
          git push
