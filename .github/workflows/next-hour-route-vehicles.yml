name: Next-hour route vehicles

'on':
  push:
    paths:
      - '.github/workflows/next-hour-route-vehicles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply next-hour vehicle patch
        run: python .github/next-hour-route-vehicles.py
      - name: Validate JavaScript
        run: |
          node --check public/enhancements.js
          grep -q 'journeysWithinHour' public/enhancements.js
          grep -q 'Alle passenden Live-Fahrzeuge bis zum Ziel' public/enhancements.js
      - name: Commit
        run: |
          git config user.name "ChatGPT Route Patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Show all relevant vehicles for departures in the next hour"
          git push
