name: Apply mobile readability fix

on:
  push:
    paths:
      - '.github/workflows/mobile-readability-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve mobile controls and attribution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')

          # Remove the Leaflet branding prefix but keep the map-provider attribution visible.
          old_map = 'const map = L.map("map",{zoomControl:false,preferCanvas:true,minZoom:8,maxZoom:19}).setView(CENTER,11);'
          new_map = 'const map = L.map("map",{zoomControl:false,attributionControl:false,preferCanvas:true,minZoom:8,maxZoom:19}).setView(CENTER,11);'
          if old_map in s:
              s = s.replace(old_map, new_map, 1)

          zoom_line = 'L.control.zoom({position:"topright"}).addTo(map);'
          attribution_line = 'L.control.attribution({position:"bottomleft",prefix:false}).addTo(map);'
          if attribution_line not in s:
              if zoom_line not in s:
                  raise SystemExit('zoom control marker not found')
              s = s.replace(zoom_line, zoom_line + '\n' + attribution_line, 1)

          # Add mobile contrast/readability overrides once.
          marker = '/* mobile-readability-fix */'
          if marker not in s:
              css = r'''
/* mobile-readability-fix */
.controls{
  padding:6px;
  background:rgba(6,11,18,.82);
  border:1px solid rgba(255,255,255,.16);
  border-radius:17px;
  box-shadow:0 8px 28px rgba(0,0,0,.48);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.controls .btn{
  background:rgba(13,20,30,.80);
  border-color:rgba(255,255,255,.18);
  box-shadow:0 2px 8px rgba(0,0,0,.30);
}
.controls .btn:hover{background:rgba(25,35,49,.92)}
.leaflet-control-attribution{
  background:rgba(5,10,16,.78)!important;
  color:rgba(235,243,255,.72)!important;
  border:1px solid rgba(255,255,255,.10)!important;
  border-radius:7px!important;
  padding:2px 5px!important;
  margin-left:8px!important;
  margin-bottom:8px!important;
  font-size:7px!important;
  line-height:1.15!important;
  max-width:min(72vw,520px)!important;
  box-shadow:0 3px 12px rgba(0,0,0,.28)!important;
}
.leaflet-control-attribution a{color:rgba(220,237,255,.86)!important}
@media(max-width:700px){
  .side{bottom:calc(10px + env(safe-area-inset-bottom))}
  .transport-panel{
    background:rgba(7,12,19,.94)!important;
    border-color:rgba(255,255,255,.16)!important;
    box-shadow:0 8px 26px rgba(0,0,0,.44)!important;
  }
  .transport-head{min-height:34px;align-items:center}
  .transport-head h2{
    margin:0!important;
    color:#f4f8ff!important;
    font-size:12px!important;
    letter-spacing:.07em!important;
  }
  .transport-head h2::before{content:"☰ ";color:#9ed1ff}
  .filter-toggle{
    display:grid!important;
    place-items:center;
    background:rgba(255,255,255,.08)!important;
    border-color:rgba(255,255,255,.18)!important;
    color:#fff!important;
  }
  .transport-panel.mobile-collapsed{min-height:46px;padding:6px 9px!important}
  .controls{
    right:9px!important;
    border-radius:16px;
    background:rgba(4,9,15,.86);
  }
  .controls .btn{background:rgba(11,18,27,.86)}
  .leaflet-control-attribution{
    margin-left:9px!important;
    margin-bottom:136px!important;
    max-width:calc(100vw - 100px)!important;
    font-size:6.5px!important;
    white-space:normal!important;
  }
  body:not(.filters-collapsed) .leaflet-control-attribution{margin-bottom:200px!important}
}
'''
              if '</style>' not in s:
                  raise SystemExit('style end marker not found')
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s, encoding='utf-8')

          # Remove this temporary workflow from the final repo state.
          Path('.github/workflows/mobile-readability-fix.yml').unlink(missing_ok=True)
          PY

          git config user.name "ChatGPT UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Improve mobile map controls and attribution"
          git push
