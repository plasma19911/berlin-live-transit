name: Fix VBB route pagination

on:
  push:
    paths:
      - '.github/workflows/fix-route-pagination.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch laterThan pagination
        shell: bash
        run: |
          set -e
          perl -0pi -e 's/function continuationParams\(laterRef\) \{.*?\n\}/function continuationParams(laterRef, baseParams) {\n  const params = new URLSearchParams(baseParams);\n  params.delete("departure");\n  params.delete("arrival");\n  params.set("laterThan", String(laterRef));\n  params.set("results", String(ROUTE_RESULTS));\n  return params;\n}/s' functions/api/route.js
          sed -i 's/continuationParams(laterRef)}/continuationParams(laterRef, params)}/' functions/api/route.js
          grep -q 'continuationParams(laterRef, baseParams)' functions/api/route.js
          grep -q 'continuationParams(laterRef, params)' functions/api/route.js
          node --check functions/api/route.js
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name "ChatGPT Route Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/fix-route-pagination.yml
          git add functions/api/route.js
          git commit -m "Fix VBB later journey pagination"
          git push
