name: Apply PWA route focus v2

on:
  push:
    paths:
      - '.github/workflows/pwa-route-focus-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - run: python .github/pwa_route_focus_patch.py
      - run: |
          git config user.name "ChatGPT UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add app icon PWA and planned route focus"
          git push
