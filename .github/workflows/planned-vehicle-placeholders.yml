name: Planned vehicle placeholders

'on':
  push:
    paths:
      - '.github/workflows/planned-vehicle-placeholders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply planned vehicle placeholder patch
        run: python .github/planned_vehicle_placeholders_patch.py
      - name: Validate JavaScript
        run: |
          node --check public/enhancements.js
          python - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          start=s.find('<script>')
          end=s.rfind('</script>')
          js=s[start+8:end]
          Path('/tmp/index-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit
        run: |
          git config user.name "ChatGPT UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Show scheduled route vehicles until live radar starts"
          git push
