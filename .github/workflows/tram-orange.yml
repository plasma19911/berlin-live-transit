name: SEV and direction arrows

'on':
  push:
    paths:
      - '.github/workflows/tram-orange.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI patch
        run: python .github/sev_direction_patch.py
      - name: Validate JavaScript
        run: |
          node --check public/enhancements.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          js=max(blocks,key=len)
          Path('/tmp/index-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit patch
        run: |
          git config user.name "ChatGPT UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/sev_direction_patch.py
          git add public/index.html public/enhancements.js
          git diff --cached --check
          git commit -m "Improve direction arrows and add replacement service styling"
          git push
