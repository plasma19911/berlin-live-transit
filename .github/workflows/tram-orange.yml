name: Tram orange

'on':
  push:
    paths:
      - '.github/workflows/tram-orange.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change tram color only
        run: |
          python -c "from pathlib import Path; p=Path('public/index.html'); s=p.read_text(encoding='utf-8'); old='tram:{name:\"Tram\",kind:\"tram\",c:\"#f6c900\",fg:\"#111111\",icon:\"TRAM\"}'; new='tram:{name:\"Tram\",kind:\"tram\",c:\"#ff8a00\",fg:\"#111111\",icon:\"TRAM\"}'; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
          python -c "from pathlib import Path; p=Path('public/enhancements.js'); s=p.read_text(encoding='utf-8'); old='tram: { c: \"#f6c900\", fg: \"#111\", label: \"TRAM\" }'; new='tram: { c: \"#ff8a00\", fg: \"#111\", label: \"TRAM\" }'; assert old in s; p.write_text(s.replace(old,new,1),encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name "ChatGPT UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html public/enhancements.js
          git diff --cached --check
          git commit -m "Make tram markers orange"
          git push
