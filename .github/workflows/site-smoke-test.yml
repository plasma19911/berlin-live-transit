name: Public site smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/site-smoke-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check public app
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --max-time 30 https://berlin-live-transit.pages.dev/ -o /tmp/index.html
          grep -q 'Berlin Live Transit' /tmp/index.html
          status=$(curl -LsS --max-time 40 -o /tmp/radar.json -w '%{http_code}' 'https://berlin-live-transit.pages.dev/api/radar-berlin')
          echo "radar_http=$status"
          cat /tmp/radar.json
          test "$status" = "200"
