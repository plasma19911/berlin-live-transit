name: Public site smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/site-smoke-test.yml'
      - 'functions/api/radar-berlin.js'
      - 'functions/api/route.js'
      - 'public/index.html'
      - 'public/enhancements.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose public app and radar
        shell: bash
        run: |
          set +e

          echo '=== PUBLIC HOME ==='
          curl -LsS --max-time 25 -o /tmp/index.html -w 'http=%{http_code} time=%{time_total}\n' 'https://berlin-live-transit.pages.dev/'

          echo '=== PUBLIC RADAR ==='
          curl -LsS --max-time 40 -o /tmp/radar.json -w 'http=%{http_code} time=%{time_total}\n' 'https://berlin-live-transit.pages.dev/api/radar-berlin'
          python -c "import json; d=json.load(open('/tmp/radar.json')); print('movements=',len(d.get('movements',[]))); print('meta=',d.get('meta')); print('error=',d.get('error')); print('details=',d.get('details'))" 2>/dev/null || head -c 800 /tmp/radar.json
          echo

          echo '=== PUBLIC ROUTE ==='
          curl -LsS --max-time 45 --get 'https://berlin-live-transit.pages.dev/api/route' --data-urlencode 'from=Alexanderplatz' --data-urlencode 'to=Hauptbahnhof' -o /tmp/route.json -w 'http=%{http_code} time=%{time_total}\n'
          python -c "import json; d=json.load(open('/tmp/route.json')); print('journey=',bool(d.get('journey')),'within_hour=',len(d.get('journeysWithinHour',[])),'error=',d.get('error'))" 2>/dev/null || head -c 500 /tmp/route.json
          echo

          echo '=== DIRECT VBB CURRENT 30s/3f ==='
          curl -LsS --max-time 25 -o /tmp/vbb-current.json -w 'http=%{http_code} time=%{time_total}\n' 'https://v6.vbb.transport.rest/radar?north=52.58&south=52.44&west=13.2375&east=13.425&results=256&duration=30&frames=3&polylines=false&language=de&pretty=false'
          python -c "import json; d=json.load(open('/tmp/vbb-current.json')); print('items=',len(d if isinstance(d,list) else d.get('movements',d.get('vehicles',[]))))" 2>/dev/null || head -c 300 /tmp/vbb-current.json
          echo

          echo '=== DIRECT VBB LIGHT 5s/1f ==='
          curl -LsS --max-time 25 -o /tmp/vbb-light.json -w 'http=%{http_code} time=%{time_total}\n' 'https://v6.vbb.transport.rest/radar?north=52.58&south=52.44&west=13.2375&east=13.425&results=256&duration=5&frames=1&polylines=false&language=de&pretty=false'
          python -c "import json; d=json.load(open('/tmp/vbb-light.json')); print('items=',len(d if isinstance(d,list) else d.get('movements',d.get('vehicles',[]))))" 2>/dev/null || head -c 300 /tmp/vbb-light.json
          echo

      - name: Diagnose browser rendering
        shell: bash
        run: |
          set +e
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          echo "chrome=$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=20000 --dump-dom 'https://berlin-live-transit.pages.dev/' > /tmp/dom.html 2>/tmp/chrome.err
          echo "chrome_exit=$?"
          echo "vehicle_dom_nodes=$(grep -o 'class=\"vicon' /tmp/dom.html | wc -l)"
          echo "vehicle_wrap_nodes=$(grep -o 'veh-wrap' /tmp/dom.html | wc -l)"
          python -c "import re; s=open('/tmp/dom.html').read(); print('total_text=',re.search(r'id=\"total\"[^>]*>([^<]*)',s).group(1) if re.search(r'id=\"total\"[^>]*>([^<]*)',s) else 'missing'); print('visible_text=',re.search(r'id=\"visible\"[^>]*>([^<]*)',s).group(1) if re.search(r'id=\"visible\"[^>]*>([^<]*)',s) else 'missing'); print('status_text=',re.search(r'id=\"st\"[^>]*>([^<]*)',s).group(1) if re.search(r'id=\"st\"[^>]*>([^<]*)',s) else 'missing')"
          tail -n 30 /tmp/chrome.err
