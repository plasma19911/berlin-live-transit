name: Public site smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/site-smoke-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable duplicate map style controller
        run: |
          grep -q '    setupMapStyles();' public/enhancements.js
          sed -i 's/    setupMapStyles();/    \/\/ duplicate map-style controller disabled; main index handles all base layers/' public/enhancements.js
          sed -i -E 's#<script src="/enhancements\.js(\?v=[^"]*)?"></script>#<script src="/enhancements.js?v=20260813-1554"></script>#' public/index.html
          node --check public/enhancements.js
          grep -q 'duplicate map-style controller disabled' public/enhancements.js
          grep -q 'enhancements.js?v=20260813-1554' public/index.html
          git diff --check
      - name: Commit app fix
        run: |
          git config user.name "ChatGPT Map Fix"
          git config user.email "actions@users.noreply.github.com"
          git add public/enhancements.js public/index.html
          git commit -m "Fix satellite style switching"
          git push
