name: Fix route mobile v2

'on':
  push:
    paths:
      - '.github/workflows/fix-route-mobile-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch route logic and mobile sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('public/enhancements.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('    if (!stops.length) return false;','    if (!stops.length) return null;',1)
          s=s.replace('    if (!boardIndexes.length || !alightIndexes.length) return false;','    if (!boardIndexes.length || !alightIndexes.length) return null;',1)
          s=s.replace('boardTime >= now - 2 * 60 * 1000','boardTime >= now - 5 * 60 * 1000',1)
          old='    window.__berlinRouteEligibility = { active: true, ready: false, ids: new Set() };\n    if (map) map.fire("moveend");\n\n    const eligible = new Set();'
          new='    const eligible = new Set();\n    const provisional = new Set();'
          assert old in s, 'eligibility init not found'
          s=s.replace(old,new,1)
          old='      if (exact) {\n        eligible.add(vehicleId);\n        continue;\n      }'
          new='      if (exact) {\n        eligible.add(vehicleId);\n        provisional.add(vehicleId);\n        continue;\n      }'
          assert old in s, 'exact block not found'
          s=s.replace(old,new,1)
          marker='      // Without a trip id we cannot inspect the future stop sequence. Use a conservative\n'
          insert='      const directionFallback = matchingLegs.some(leg => directionLooksCompatible(vehicle, leg));\n\n'
          assert marker in s, 'fallback marker not found'
          s=s.replace(marker,insert+marker,1)
          old='        if (matchingLegs.some(leg => directionLooksCompatible(vehicle, leg))) eligible.add(vehicleId);'
          new='        if (directionFallback) {\n          eligible.add(vehicleId);\n          provisional.add(vehicleId);\n        }'
          assert old in s, 'no trip fallback not found'
          s=s.replace(old,new,1)
          old='      jobs.push({ vehicleId, liveTripId, matchingLegs });\n    }\n\n    // Limit concurrent trip lookups on mobile while still validating every candidate.'
          new='      if (directionFallback) provisional.add(vehicleId);\n      jobs.push({ vehicleId, liveTripId, matchingLegs, directionFallback });\n    }\n\n    window.__berlinRouteEligibility = { active: true, ready: true, ids: provisional };\n    if (map) map.fire("moveend");\n\n    // Limit concurrent trip lookups on mobile while still validating every candidate.'
          assert old in s, 'jobs tail not found'
          s=s.replace(old,new,1)
          old='        if (!trip) continue;\n        if (job.matchingLegs.some(leg => tripStillReachesLeg(trip, leg))) eligible.add(job.vehicleId);'
          new='        if (!trip) {\n          if (job.directionFallback) eligible.add(job.vehicleId);\n          continue;\n        }\n        let confirmed = false;\n        let unknown = false;\n        for (const leg of job.matchingLegs) {\n          const status = tripStillReachesLeg(trip, leg);\n          if (status === true) { confirmed = true; break; }\n          if (status === null) unknown = true;\n        }\n        if (confirmed || (unknown && job.directionFallback)) eligible.add(job.vehicleId);'
          assert old in s, 'worker block not found'
          s=s.replace(old,new,1)
          s=s.replace('    if (filter.fitVehiclesOnce) filter.fitVehiclesOnce = true;','    if (eligible.size) filter.fitVehiclesOnce = true;',1)
          css_end='    .zoom-far .kind-tram .veh-symbol::before{content:"T"!important;font-size:10px!important}\n  `;'
          css_new='    .zoom-far .kind-tram .veh-symbol::before{content:"T"!important;font-size:10px!important}\n    @media(max-width:700px){\n      .detail-panel{left:8px!important;right:8px!important;top:auto!important;bottom:8px!important;width:auto!important;height:min(48vh,420px)!important;min-height:300px!important;max-height:min(48vh,420px)!important;overflow:hidden!important;border-radius:15px!important;padding:9px 10px!important}\n      .detail-panel.show{display:flex!important;flex-direction:column!important}\n      .detail-head{flex:0 0 auto!important;min-height:38px!important}\n      #detailBody{flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:3px!important;padding-bottom:10px!important}\n      .detail-grid{margin-top:6px!important;font-size:10px!important;grid-template-columns:86px 1fr!important;gap:4px 7px!important}\n      .route-chip{white-space:normal!important;line-height:1.3!important;margin-top:7px!important}\n      .detail-section{height:auto!important;max-height:none!important;overflow:visible!important;margin-top:8px!important;padding-top:7px!important}\n      .detail-section h3{position:sticky!important;top:0!important;z-index:3!important;padding:5px 0!important;background:rgba(12,18,28,.98)!important;font-size:10px!important}\n      .route-leg{padding:7px 0!important;font-size:10px!important;line-height:1.3!important;gap:8px!important}\n      .route-leg-badge{min-width:52px!important;font-size:9px!important;padding:4px 5px!important}\n      .route-leg .stop-meta{display:block!important;font-size:8.5px!important;margin-top:2px!important}\n    }\n  `;'
          assert css_end in s, 'css end not found'
          s=s.replace(css_end,css_new,1)
          p.write_text(s,encoding='utf-8')
          ip=Path('public/index.html')
          h=ip.read_text(encoding='utf-8')
          h,n=re.subn(r'<script src="/enhancements\.js(?:\?v=[^"]*)?"></script>','<script src="/enhancements.js?v=20260813-1447"></script>',h,count=1)
          assert n==1, 'script tag not found'
          ip.write_text(h,encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check public/enhancements.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text(max(blocks,key=len),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          grep -q 'enhancements.js?v=20260813-1447' public/index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name "ChatGPT Route Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/fix-route-and-mobile-sheet.yml .github/workflows/fix-route-mobile-v2.yml
          git add public/enhancements.js public/index.html
          git commit -m "Fix route live vehicles and mobile route sheet"
          git push
