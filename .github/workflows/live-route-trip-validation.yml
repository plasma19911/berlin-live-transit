name: Live route trip validation

'on':
  push:
    paths:
      - '.github/workflows/live-route-trip-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply trip-aware vehicle filter
        run: python .github/live_route_trip_validation_patch.py
      - name: Validate JavaScript
        run: |
          node --check public/enhancements.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          js=max(blocks,key=len)
          Path('/tmp/index-inline.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
      - name: Commit clean patch
        run: |
          git config user.name "ChatGPT UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/live_route_trip_validation_patch.py .github/workflows/live-route-trip-validation.yml
          git add public/index.html public/enhancements.js
          git diff --cached --check
          git commit -m "Show actual approaching live vehicles using trip stop sequence"
          git push
