name: Planned route vehicle match v2

'on':
  push:
    paths:
      - '.github/workflows/route-vehicle-match-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply matcher patch
        run: python .github/route_vehicle_match_v2.py
      - name: Commit
        run: |
          git config user.name "ChatGPT UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Improve planned route live vehicle matching"
          git push
