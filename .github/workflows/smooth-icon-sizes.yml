name: Smooth icon sizes

'on':
  push:
    paths:
      - '.github/workflows/smooth-icon-sizes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smooth vehicle icon sizes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old='.zoom-mid .veh-line{font-size:7px}\n/* Progressive overview sizing: the farther out, the smaller the vehicle marker. */'
          new='.zoom-mid .veh-line{font-size:7px}\n.zoom-mid .veh-wrap{transform:scale(.65);transform-origin:50% 50%}\n.zoom-near .veh-wrap{transform:scale(.78);transform-origin:50% 50%}\n@media(max-width:700px){.zoom-mid .veh-wrap{transform:scale(.55)}.zoom-near .veh-wrap{transform:scale(.68)}}\n/* Progressive overview sizing: the farther out, the smaller the vehicle marker. */'
          assert old in s, 'zoom-mid block not found'
          s=s.replace(old,new,1)
          old='  el.classList.toggle("zoom-overview-11",z===11);\n  el.classList.toggle("zoom-mid",z===12||z===13);'
          new='  el.classList.toggle("zoom-overview-11",z===11);\n  el.classList.toggle("zoom-mid",z===12||z===13);\n  el.classList.toggle("zoom-near",z>=14);'
          assert old in s, 'density block not found'
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text(max(blocks,key=len),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "ChatGPT UI Patch"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/smooth-icon-sizes.yml
          git add public/index.html
          git commit -m "Keep vehicle icons compact when zooming in"
          git push
