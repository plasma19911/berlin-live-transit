name: Fix route and mobile sheet

on:
  push:
    paths:
      - '.github/workflows/fix-route-and-mobile-sheet.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch planner eligibility and mobile route sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/enhancements.js')
          s=p.read_text(encoding='utf-8')

          old='''  function tripStillReachesLeg(trip, leg) {
    const stops = Array.isArray(trip?.stopovers) ? trip.stopovers : [];
    if (!stops.length) return false;

    const boardIndexes = [];
    const alightIndexes = [];
    for (let i = 0; i < stops.length; i++) {
      if (stopMatches(stops[i], leg.boardId, leg.boardName, leg.boardLat, leg.boardLon)) boardIndexes.push(i);
      if (stopMatches(stops[i], leg.alightId, leg.alightName, leg.alightLat, leg.alightLon)) alightIndexes.push(i);
    }
    if (!boardIndexes.length || !alightIndexes.length) return false;

    const now = Date.now();
    for (const bi of boardIndexes) {
      const ai = alightIndexes.find(x => x > bi);
      if (ai == null) continue; // wrong direction: destination occurs before boarding stop
      const boardTime = stopTimeMs(stops[bi]);
      // A short grace period keeps a delayed vehicle visible around the boarding stop.
      if (!Number.isFinite(boardTime) || boardTime >= now - 2 * 60 * 1000) return true;
    }
    return false;
  }'''
          new='''  function tripStillReachesLeg(trip, leg) {
    const stops = Array.isArray(trip?.stopovers) ? trip.stopovers : [];
    // null = technisch nicht sicher prüfbar. Dann darf der Linien-/Richtungs-Fallback greifen.
    if (!stops.length) return null;

    const boardIndexes = [];
    const alightIndexes = [];
    for (let i = 0; i < stops.length; i++) {
      if (stopMatches(stops[i], leg.boardId, leg.boardName, leg.boardLat, leg.boardLon)) boardIndexes.push(i);
      if (stopMatches(stops[i], leg.alightId, leg.alightName, leg.alightLat, leg.alightLon)) alightIndexes.push(i);
    }
    if (!boardIndexes.length || !alightIndexes.length) return null;

    const now = Date.now();
    let orderedPairFound = false;
    for (const bi of boardIndexes) {
      const ai = alightIndexes.find(x => x > bi);
      if (ai == null) continue;
      orderedPairFound = true;
      const boardTime = stopTimeMs(stops[bi]);
      // Mehr Toleranz für Verspätung: ein Fahrzeug am/kurz vor dem Einstieg nicht zu früh ausblenden.
      if (!Number.isFinite(boardTime) || boardTime >= now - 5 * 60 * 1000) return true;
    }
    // Beide Halte wurden gefunden, aber Ziel liegt nicht nach Einstieg bzw. Einstieg ist vorbei.
    return orderedPairFound ? false : false;
  }'''
          assert old in s, 'tripStillReachesLeg block not found'
          s=s.replace(old,new,1)

          old='''    window.__berlinRouteEligibility = { active: true, ready: false, ids: new Set() };
    if (map) map.fire("moveend");

    const eligible = new Set();
    const jobs = [];
    const now = Date.now();'''
          new='''    const eligible = new Set();
    const provisional = new Set();
    const jobs = [];
    const now = Date.now();'''
          assert old in s, 'eligibility init block not found'
          s=s.replace(old,new,1)

          old='''      if (exact) {
        eligible.add(vehicleId);
        continue;
      }

      // Without a trip id we cannot inspect the future stop sequence. Use a conservative
      // same-line + same-direction fallback rather than hiding a potentially useful live bus/train.
      if (!liveTripId) {
        if (matchingLegs.some(leg => directionLooksCompatible(vehicle, leg))) eligible.add(vehicleId);
        continue;
      }

      jobs.push({ vehicleId, liveTripId, matchingLegs });
    }

    // Limit concurrent trip lookups on mobile while still validating every candidate.'''
          new='''      if (exact) {
        eligible.add(vehicleId);
        provisional.add(vehicleId);
        continue;
      }

      const directionFallback = matchingLegs.some(leg => directionLooksCompatible(vehicle, leg));

      // Ohne Trip-ID bleibt Linie + Richtung sichtbar, weil keine Stoppreihenfolge geprüft werden kann.
      if (!liveTripId) {
        if (directionFallback) {
          eligible.add(vehicleId);
          provisional.add(vehicleId);
        }
        continue;
      }

      // Während die Stoppreihenfolge geladen wird, passende echte Live-Fahrzeuge sofort zeigen.
      // So verschwindet nicht der ganze Bus-/Bahn-Zubringer während mehrerer API-Abfragen.
      if (directionFallback) provisional.add(vehicleId);
      jobs.push({ vehicleId, liveTripId, matchingLegs, vehicle, directionFallback });
    }

    window.__berlinRouteEligibility = { active: true, ready: true, ids: provisional };
    if (map) map.fire("moveend");

    // Limit concurrent trip lookups on mobile while still validating every candidate.'''
          assert old in s, 'candidate block not found'
          s=s.replace(old,new,1)

          old='''        const trip = await fetchLiveTrip(job.liveTripId);
        if (seq !== routeState.eligibilitySeq) return;
        if (!trip) continue;
        if (job.matchingLegs.some(leg => tripStillReachesLeg(trip, leg))) eligible.add(job.vehicleId);'''
          new='''        const trip = await fetchLiveTrip(job.liveTripId);
        if (seq !== routeState.eligibilitySeq) return;
        if (!trip) {
          // Trip-Endpunkt nicht auswertbar: nicht blind ausblenden, wenn Linie + Richtung passen.
          if (job.directionFallback) eligible.add(job.vehicleId);
          continue;
        }
        let confirmed = false;
        let unknown = false;
        for (const leg of job.matchingLegs) {
          const status = tripStillReachesLeg(trip, leg);
          if (status === true) { confirmed = true; break; }
          if (status === null) unknown = true;
        }
        if (confirmed || (unknown && job.directionFallback)) eligible.add(job.vehicleId);'''
          assert old in s, 'trip worker block not found'
          s=s.replace(old,new,1)

          old='''    window.__berlinRouteEligibility = { active: true, ready: true, ids: eligible };
    if (filter.fitVehiclesOnce) filter.fitVehiclesOnce = true;
    if (map) map.fire("moveend");'''
          new='''    window.__berlinRouteEligibility = { active: true, ready: true, ids: eligible };
    if (eligible.size) filter.fitVehiclesOnce = true;
    if (map) map.fire("moveend");'''
          assert old in s, 'eligibility final block not found'
          s=s.replace(old,new,1)

          marker='''    .zoom-far .kind-tram .veh-symbol::before{content:"T"!important;font-size:10px!important}
  `;'''
          mobile='''    .zoom-far .kind-tram .veh-symbol::before{content:"T"!important;font-size:10px!important}
    @media(max-width:700px){
      .detail-panel{
        left:8px!important;right:8px!important;top:auto!important;bottom:8px!important;
        width:auto!important;height:min(48vh,420px)!important;min-height:300px!important;
        max-height:min(48vh,420px)!important;overflow:hidden!important;
        border-radius:15px!important;padding:9px 10px!important;
      }
      .detail-panel.show{display:flex!important;flex-direction:column!important}
      .detail-head{flex:0 0 auto!important;min-height:38px!important}
      #detailBody{
        flex:1 1 auto!important;min-height:0!important;overflow-y:auto!important;overflow-x:hidden!important;
        -webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:3px!important;padding-bottom:10px!important;
      }
      .detail-grid{margin-top:6px!important;font-size:10px!important;grid-template-columns:86px 1fr!important;gap:4px 7px!important}
      .route-chip{white-space:normal!important;line-height:1.3!important;margin-top:7px!important}
      .detail-section{height:auto!important;max-height:none!important;overflow:visible!important;margin-top:8px!important;padding-top:7px!important}
      .detail-section h3{position:sticky!important;top:0!important;z-index:3!important;padding:5px 0!important;background:rgba(12,18,28,.98)!important;font-size:10px!important}
      .route-leg{padding:7px 0!important;font-size:10px!important;line-height:1.3!important;gap:8px!important}
      .route-leg-badge{min-width:52px!important;font-size:9px!important;padding:4px 5px!important}
      .route-leg .stop-meta{display:block!important;font-size:8.5px!important;margin-top:2px!important}
    }
  `;'''
          assert marker in s, 'enhancements css end marker not found'
          s=s.replace(marker,mobile,1)
          p.write_text(s,encoding='utf-8')

          ip=Path('public/index.html')
          h=ip.read_text(encoding='utf-8')
          import re
          h,n=re.subn(r'<script src="/enhancements\.js(?:\?v=[^"]*)?"></script>', '<script src="/enhancements.js?v=20260813-1443"></script>', h, count=1)
          assert n==1, 'enhancements script tag not found'
          ip.write_text(h,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check public/enhancements.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text(max(blocks,key=len),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          grep -q 'enhancements.js?v=20260813-1443' public/index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name "ChatGPT Route Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/fix-route-and-mobile-sheet.yml
          git add public/enhancements.js public/index.html
          git commit -m "Fix route live vehicles and mobile route sheet"
          git push
