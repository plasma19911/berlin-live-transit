name: Fix live vehicles

'on':
  push:
    paths:
      - '.github/workflows/fix-live-vehicles.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live vehicle fix
        run: python .github/fix-live-vehicles.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          assert '<script src="/enhancements.js"></script>' in s
          assert 'plannedRouteVehicleMatch(d,{relaxed=false}={})' in s
          assert 'plannedRouteVehicleMatch(d,{relaxed:true})' in s
          assert 'const plannedFilterActive=Boolean(routeFilter?.active' in s
          print('validation ok')
          PY
          git config user.name "ChatGPT Repair"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/fix-live-vehicles.py .github/workflows/fix-live-vehicles.yml
          git add -A
          git diff --cached --check
          git commit -m "Repair live vehicle rendering and route matching"
          git push
