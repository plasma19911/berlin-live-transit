name: Fix map style position

on:
  push:
    paths:
      - '.github/workflows/fix-map-style-position.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate satellite handler and preserve viewport
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('public/enhancements.js')
          s = p.read_text(encoding='utf-8')
          start = s.index('  function switchToSatellite() {')
          end = s.index('  function setupTransportPanel() {', start)
          replacement = '''  // Map styles are owned exclusively by public/index.html.\n  // Keeping a second satellite handler here caused competing tile layers.\n  function setupMapStyles() {\n    return;\n  }\n\n'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          old = '''function setMapStyle(key,{save=true,closeMenu=true}={}){\n  if(!MAP_STYLES[key])key="dark";\n  const style=MAP_STYLES[key];\n  const next=L.tileLayer(style.url,{...style.options,keepBuffer:3,updateWhenIdle:true});\n  next.addTo(map);\n  if(baseLayer&&map.hasLayer(baseLayer))map.removeLayer(baseLayer);\n  baseLayer=next;'''
          new = '''function setMapStyle(key,{save=true,closeMenu=true}={}){\n  if(!MAP_STYLES[key])key="dark";\n  const style=MAP_STYLES[key];\n  const keepCenter=map.getCenter();\n  const keepZoom=map.getZoom();\n  const next=L.tileLayer(style.url,{...style.options,keepBuffer:3,updateWhenIdle:true});\n  next.addTo(map);\n  if(baseLayer&&map.hasLayer(baseLayer))map.removeLayer(baseLayer);\n  baseLayer=next;\n  // A style switch must never change the user's map position.\n  map.setView(keepCenter,keepZoom,{animate:false});\n  map.invalidateSize(false);'''
          assert old in s, 'setMapStyle block not found'
          s = s.replace(old, new, 1)
          s = s.replace('/enhancements.js?v=20260813-1447', '/enhancements.js?v=20260813-1505', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check public/enhancements.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/index-inline.js').write_text(max(blocks,key=len),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "ChatGPT Map Fix"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/fix-map-style-position.yml
          git add public/index.html public/enhancements.js
          git commit -m "Keep map position when switching styles"
          git push
